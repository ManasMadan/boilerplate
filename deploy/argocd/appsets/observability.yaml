# Traces and metrics (deploy/platform/addons/observability) on the clusters that opt in
# with the label boilerplate.dev/observability: "true" on their Argo CD Secret. The same
# label makes the envs and previews ApplicationSets point every service's OTLP export at
# them. Add-on files have the same shape as the platform ApplicationSet's.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  boilerplate.dev/observability: "true"
          - git:
              repoURL: https://github.com/ManasMadan/boilerplate.git
              revision: HEAD
              files:
                - path: deploy/platform/addons/observability/*.yaml
  template:
    metadata:
      name: "{{ .name }}-{{ .addon }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      destination:
        server: "{{ .server }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # kube-prometheus-stack's CRDs are larger than the client-side apply limit.
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            # node-exporter reads the host (hostPath, hostNetwork, hostPID).
            pod-security.kubernetes.io/enforce: privileged
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    spec:
      sources:
        {{- if hasKey . "path" }}
        - repoURL: https://github.com/ManasMadan/boilerplate.git
          targetRevision: HEAD
          path: {{ .path }}
          helm:
            releaseName: {{ .addon }}
        {{- else }}
        - repoURL: {{ .repoURL }}
          chart: {{ .chart }}
          targetRevision: {{ .version }}
          helm:
            releaseName: {{ .addon }}
            valueFiles:
              - $repo/deploy/platform/values/{{ .addon }}.yaml
        - repoURL: https://github.com/ManasMadan/boilerplate.git
          targetRevision: HEAD
          ref: repo
        {{- end }}
