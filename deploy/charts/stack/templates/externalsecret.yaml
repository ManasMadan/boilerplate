{{- /*
Each service's secrets from the secret manager: the remote secret `<keyPrefix><service>`
is one JSON object, and every key becomes an environment variable of the service.
*/}}
{{- $es := .Values.secrets.externalSecrets }}
{{- if $es.enabled }}
{{- range $name := keys .Values.services | sortAlpha }}
{{- $svc := include "stack.service" (list $ $name) | fromYaml }}
{{- if and $svc.enabled (not $svc.secretFrom) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "stack.fullname" (list $ $name) }}
  labels:
    {{- include "stack.labels" (list $ $name) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.storeRef | nindent 4 }}
  target:
    name: {{ include "stack.fullname" (list $ $name) }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s%s" $es.keyPrefix $name }}
{{- end }}
{{- end }}
{{- end }}
