suite: data
release: { name: demo, namespace: apps }
set:
  storage.uploads.host: files.example.com
  storage.uploads.corsOrigins: [https://app.example.com]
tests:
  - it: bootstraps Postgres with the migrator owning the database
    template: postgres.yaml
    documentSelector: { path: kind, value: Cluster }
    asserts:
      - equal: { path: spec.bootstrap.initdb.owner, value: migrator }
      - equal: { path: spec.bootstrap.initdb.secret.name, value: db-migrator }
      - equal: { path: spec.enableSuperuserAccess, value: false }
      - equal: { path: spec.storage.storageClass, value: local-path }
      - contains: { path: spec.bootstrap.initdb.postInitApplicationSQL, content: CREATE EXTENSION IF NOT EXISTS vector }
      - contains: { path: spec.bootstrap.initdb.postInitApplicationSQL, content: CREATE ROLE app_api NOLOGIN NOBYPASSRLS NOINHERIT }
      - contains: { path: spec.bootstrap.initdb.postInitApplicationSQL, content: GRANT CONNECT ON DATABASE app TO app_api }
      - notContains: { path: spec.bootstrap.initdb.postInitApplicationSQL, content: CREATE ROLE migrator NOLOGIN NOBYPASSRLS NOINHERIT }

  - it: manages each service role without row-level security bypass
    template: postgres.yaml
    documentSelector: { path: kind, value: Cluster }
    asserts:
      - lengthEqual: { path: spec.managed.roles, count: 5 }
      - contains:
          path: spec.managed.roles
          content:
            name: app_worker
            ensure: present
            login: true
            bypassrls: false
            inherit: false
            passwordSecret: { name: db-app-worker }

  - it: takes no backups unless asked to
    template: postgres.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - notExists: { path: spec.plugins }

  - it: archives WAL and takes scheduled base backups to the backups server
    template: postgres.yaml
    set:
      postgres.backups.enabled: true
    asserts:
      - hasDocuments: { count: 3 }
      - equal:
          path: spec.plugins
          value:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters: { barmanObjectName: demo-backups, serverName: demo-postgres }
        documentSelector: { path: kind, value: Cluster }
      - equal:
          path: spec.configuration.endpointURL
          value: http://demo-backups.apps.svc.cluster.local:9000
        documentSelector: { path: kind, value: ObjectStore }
      - equal: { path: spec.configuration.destinationPath, value: s3://backups/ }
        documentSelector: { path: kind, value: ObjectStore }
      - equal: { path: spec.retentionPolicy, value: 30d }
        documentSelector: { path: kind, value: ObjectStore }
      - equal:
          path: spec.configuration.s3Credentials.accessKeyId
          value: { name: demo-backups-storage, key: accessKeyId }
        documentSelector: { path: kind, value: ObjectStore }
      - equal: { path: spec.method, value: plugin }
        documentSelector: { path: kind, value: ScheduledBackup }
      - equal: { path: spec.immediate, value: true }
        documentSelector: { path: kind, value: ScheduledBackup }

  - it: restores from the backups to a point in time, archiving to a new folder
    template: postgres.yaml
    set:
      postgres.backups.enabled: true
      postgres.backups.serverName: demo-postgres-2
      postgres.restore.enabled: true
      postgres.restore.serverName: demo-postgres
      postgres.restore.targetTime: "2026-09-30T08:15:00Z"
    documentSelector: { path: kind, value: Cluster }
    asserts:
      - notExists: { path: spec.bootstrap.initdb }
      - equal:
          path: spec.bootstrap.recovery
          value:
            source: origin
            database: app
            owner: migrator
            secret: { name: db-migrator }
            recoveryTarget: { targetTime: "2026-09-30T08:15:00Z" }
      - equal:
          path: spec.externalClusters
          value:
            - name: origin
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters: { barmanObjectName: demo-backups, serverName: demo-postgres }
      - equal: { path: "spec.plugins[0].parameters.serverName", value: demo-postgres-2 }

  - it: refuses to restore into the folder the backup came from
    template: postgres.yaml
    set:
      postgres.backups.enabled: true
      postgres.restore.enabled: true
      postgres.restore.serverName: demo-postgres
    asserts:
      - failedTemplate:
          errorMessage: "postgres.backups.serverName must differ from postgres.restore.serverName: the restored cluster archives to a new folder, never over the backup it came from"

  - it: refuses to restore without backups
    template: postgres.yaml
    set:
      postgres.restore.enabled: true
      postgres.restore.serverName: demo-postgres
    asserts:
      - failedTemplate:
          errorMessage: "postgres.restore needs postgres.backups.enabled: the backups are what it restores from"

  - it: generates every credential in the cluster before the release's resources
    template: credentials.yaml
    documentSelector: { path: kind, value: Job }
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/sync-wave: "-10"
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      - equal: { path: spec.template.spec.serviceAccountName, value: demo-credentials }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - matchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: >-
            create db-app-api '\{"apiVersion":"v1","kind":"Secret","metadata":\{"labels":\{"cnpg.io/reload":"true"\},"name":"db-app-api"\},"stringData":\{"directUrl":"postgresql://app_api:@password@@demo-postgres-rw.apps.svc.cluster.local:5432/app","password":"@password@","url":"postgresql://app_api:@password@@demo-postgres-rw.apps.svc.cluster.local:5432/app","username":"app_api"\},"type":"kubernetes.io/basic-auth"\}'
      - matchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: 'create valkey .*"url":"redis://:@password@@demo-valkey.apps.svc.cluster.local:6379"'
      - matchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: 'create storage .*"accessKeyId":"@key@","bucket":"uploads","endpoint":"http://demo-uploads.apps.svc.cluster.local:9000","publicEndpoint":"https://files.example.com"'
      # The backups server's keys only with backups on.
      - notMatchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: demo-backups-storage

  - it: may only create Secrets, never read or change them
    template: credentials.yaml
    documentSelector: { path: kind, value: Role }
    asserts:
      - equal:
          path: rules
          value: [{ apiGroups: [""], resources: [secrets], verbs: [create] }]
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "-20" }

  - it: generates the backups server's keys with backups on
    template: credentials.yaml
    set:
      postgres.backups.enabled: true
    documentSelector: { path: kind, value: Job }
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].args[0]"
          pattern: 'create demo-backups-storage .*"accessKeyId":"@key@","secretAccessKey":"@password@"'

  - it: runs Valkey without eviction, persisted, with its password from the Secret
    template: valkey.yaml
    documentSelector: { path: kind, value: StatefulSet }
    asserts:
      - contains: { path: "spec.template.spec.containers[0].args", content: noeviction }
      - contains: { path: "spec.template.spec.containers[0].args", content: "$(VALKEY_PASSWORD)" }
      - equal: { path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true }
      - equal: { path: "spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef", value: { name: valkey, key: password } }
      - equal: { path: "spec.volumeClaimTemplates[0].spec.storageClassName", value: local-path }

  - it: runs the uploads server with its keys from the storage Secret
    template: storage.yaml
    documentSelector: { path: kind, value: StatefulSet }
    asserts:
      - equal: { path: metadata.name, value: demo-uploads }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: RUSTFS_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: storage, key: accessKeyId } }
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 10001 }
      - equal: { path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true }
      - equal: { path: "spec.template.spec.containers[0].readinessProbe.httpGet.path", value: /health }

  - it: routes the public files host to the uploads server
    template: storage.yaml
    documentSelector: { path: kind, value: HTTPRoute }
    asserts:
      - equal: { path: spec.hostnames, value: [files.example.com] }
      - equal: { path: "spec.rules[0].backendRefs", value: [{ name: demo-uploads, port: 9000 }] }
      - equal: { path: spec.parentRefs, value: [{ name: public, namespace: gateway-system }] }
      - equal: { path: metadata.annotations, value: { boilerplate.dev/external-dns: "true" } }

  - it: creates the uploads bucket with CORS for the site after each sync
    template: storage.yaml
    documentSelector: { path: metadata.name, value: demo-uploads-buckets }
    asserts:
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/hook"]', value: PostSync }
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: "post-install,post-upgrade" }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: CORS
            value: '{"CORSRules":[{"AllowedHeaders":["*"],"AllowedMethods":["PUT","GET"],"AllowedOrigins":["https://app.example.com"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: BUCKET, value: uploads }

  - it: lets only Postgres and the bucket Job reach the backups server
    template: storage.yaml
    set:
      postgres.backups.enabled: true
      storage.uploads.enabled: false
    documentSelector: { path: kind, value: NetworkPolicy }
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: { matchLabels: { cnpg.io/cluster: demo-postgres } }
                - podSelector: { matchLabels: { app.kubernetes.io/name: buckets, app.kubernetes.io/instance: demo } }
              ports: [{ port: 9000 }]

  - it: runs no backups server and no public route for backups
    template: storage.yaml
    set:
      postgres.backups.enabled: true
      storage.uploads.enabled: false
    asserts:
      # Service, StatefulSet, NetworkPolicy and the bucket Job.
      - hasDocuments: { count: 4 }
      - notEqual: { path: kind, value: HTTPRoute }

  - it: needs the uploads host and the site's origin
    template: storage.yaml
    set:
      storage.uploads.corsOrigins: []
    asserts:
      - failedTemplate: { errorMessage: "storage.uploads.corsOrigins needs the site's origin (browsers upload from it)" }

  - it: renders no object storage when it's off
    template: storage.yaml
    set:
      storage.uploads.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: owns a preview's namespace, with quotas, applied before everything else
    template: preview.yaml
    set:
      preview.enabled: true
      preview.namespace: pr-42
    asserts:
      - hasDocuments: { count: 3 }
      - equal: { path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: restricted }
        documentSelector: { path: kind, value: Namespace }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "-30" }
        documentSelector: { path: kind, value: Namespace }
      - equal: { path: 'spec.hard["requests.memory"]', value: 8Gi }
        documentSelector: { path: kind, value: ResourceQuota }

  - it: needs a namespace for a preview
    template: preview.yaml
    set:
      preview.enabled: true
    asserts:
      - failedTemplate: { errorMessage: preview.namespace is required for a preview }
