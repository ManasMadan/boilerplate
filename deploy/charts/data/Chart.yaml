apiVersion: v2
name: data
description: >-
  What the application stores its data in: Postgres (a CloudNativePG cluster, or a
  managed database's credentials), Valkey, and the Secrets the stack chart reads to
  reach them. A separate release from the stack, so migrations (a stack hook) always
  find the database already running.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.31.0-0"
