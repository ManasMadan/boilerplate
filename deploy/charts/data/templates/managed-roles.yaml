{{- /*
Roles on a managed database (see managedRoles in values.yaml). The SQL mirrors
infra/postgres/init/01-roles-and-databases.sql and the CloudNativePG bootstrap in
postgres.yaml; passwords come from each role's Secret, through psql variables.
*/}}
{{- if not .Values.postgres.enabled }}
{{- $db := .Values.database.name }}
{{- $name := printf "%s-roles" (include "data.name" .) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
data:
  roles.sql: |
    \set ON_ERROR_STOP on
    {{- range $role := .Values.database.roles }}
    {{- /* No NOBYPASSRLS: new roles never bypass row-level security, and a managed
    database's admin isn't allowed to state it (checked below instead). */}}
    {{- $attrs := ternary "LOGIN" "LOGIN NOINHERIT" (eq $role "migrator") }}
    SELECT format('CREATE ROLE %I {{ $attrs }}', {{ $role | squote }})
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = {{ $role | squote }}) \gexec
    ALTER ROLE {{ $role }} WITH {{ $attrs }} PASSWORD :'{{ $role }}_password';
    {{- end }}
    -- The admin needs the migrator's membership to hand it the database.
    GRANT migrator TO CURRENT_USER;
    ALTER DATABASE {{ $db }} OWNER TO migrator;
    REVOKE ALL ON DATABASE {{ $db }} FROM PUBLIC;
    {{- range $role := without .Values.database.roles "migrator" }}
    GRANT CONNECT ON DATABASE {{ $db }} TO {{ $role }};
    {{- end }}
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    -- Row-level security is the tenant boundary: no role of ours may bypass it.
    DO $$ BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolbypassrls AND rolname IN ({{ range $i, $r := .Values.database.roles }}{{ if $i }}, {{ end }}{{ $r | squote }}{{ end }})) THEN
        RAISE EXCEPTION 'a role of the application can bypass row-level security';
      END IF;
    END $$;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The postgres user of the Alpine image.
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roles
          image: {{ .Values.managedRoles.image }}
          command: [sh, -c]
          args:
            - >-
              exec psql "$ADMIN_URL" -X -q
              {{- range $role := .Values.database.roles }}
              -v {{ $role }}_password="${{ $role | upper }}_PASSWORD"
              {{- end }}
              -f /sql/roles.sql
          env:
            - name: ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "data.roleSecret" (list . "admin") }}
                  key: url
            {{- range $role := .Values.database.roles }}
            - name: {{ $role | upper }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data.roleSecret" (list $ $role) }}
                  key: password
            {{- end }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: {{ $name }}
{{- end }}
