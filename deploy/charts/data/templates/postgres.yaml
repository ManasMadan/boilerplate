{{- /*
The application's Postgres (CloudNativePG): the same roles and privileges as local
development (infra/postgres/init) and managed databases (OpenTofu).

The migrator owns the database. Service roles are created during bootstrap without a
login, so the database can grant them CONNECT; CloudNativePG then manages them (login,
password from their Secret, no RLS bypass). Table privileges come from migrations.
*/}}
{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
{{- $db := .Values.database.name }}
{{- $appRoles := include "data.appRoles" . | fromJsonArray }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "data.postgres" . }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  instances: {{ $pg.instances }}
  imageName: {{ $pg.imageName }}
  enableSuperuserAccess: false
  postgresql:
    parameters:
      {{- range $key, $value := $pg.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  bootstrap:
    initdb:
      database: {{ $db }}
      owner: migrator
      secret:
        name: {{ include "data.roleSecret" (list . "migrator") }}
      postInitApplicationSQL:
        # Extensions need a superuser, so they're created here rather than in migrations.
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        - REVOKE CREATE ON SCHEMA public FROM PUBLIC
        - REVOKE ALL ON DATABASE {{ $db }} FROM PUBLIC
        {{- range $role := $appRoles }}
        - CREATE ROLE {{ $role }} NOLOGIN NOBYPASSRLS NOINHERIT
        - GRANT CONNECT ON DATABASE {{ $db }} TO {{ $role }}
        {{- end }}
  managed:
    roles:
      {{- range $role := $appRoles }}
      - name: {{ $role }}
        ensure: present
        login: true
        bypassrls: false
        inherit: false
        passwordSecret:
          name: {{ include "data.roleSecret" (list $ $role) }}
      {{- end }}
  storage:
    size: {{ $pg.storage.size }}
    {{- with $pg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  affinity:
    # Instances on different nodes where there are several.
    podAntiAffinityType: preferred
  {{- if $pg.backups.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ required "postgres.backups.objectStore is required with backups on" $pg.backups.objectStore }}
  {{- end }}
{{- if $pg.backups.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "data.postgres" . }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  schedule: {{ $pg.backups.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "data.postgres" . }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}
