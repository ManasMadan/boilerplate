{{- /*
One Secret per database role (keys username, password, url, directUrl) and one for
Valkey (host, port, password, url), from External Secrets unless they're provided.
CloudNativePG reads the role Secrets to set each role's password; the stack's services
read `url` (and the worker `directUrl`).

ESO renders `{{ .password }}` in the templates below, so they're escaped for Helm.
*/}}
{{- $source := .Values.credentials.source }}
{{- if and (eq $source "generate") (not .Values.postgres.enabled) }}
{{- fail "credentials.source=generate makes passwords for in-cluster Postgres; a managed database's credentials are extracted (credentials.source=extract)" }}
{{- end }}
{{- if ne $source "provided" }}
{{- $store := .Values.credentials.storeRef }}
{{- if eq $source "generate" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "data.name" . }}-password
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  length: 40
  digits: 10
  # Letters and digits only: the password goes into connection URLs unescaped.
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- end }}
{{- range $role := .Values.database.roles }}
{{- $secret := include "data.roleSecret" (list $ $role) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "data.labels" $ | nindent 4 }}
spec:
  {{- if eq $source "generate" }}
  # Generated once: a refresh would change the password under a running database.
  refreshInterval: "0"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "data.name" $ }}-password
  {{- else }}
  refreshInterval: 15m
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  dataFrom:
    - extract:
        key: {{ printf "%s%s" $.Values.credentials.keyPrefix ($role | replace "_" "-") }}
  {{- end }}
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CloudNativePG applies a changed password without a restart.
          cnpg.io/reload: "true"
      {{- if eq $source "generate" }}
      data:
        {{- $url := printf "postgresql://%s:{{ .password }}@%s:5432/%s" $role (include "data.postgresHost" $) $.Values.database.name }}
        username: {{ $role }}
        password: "{{ "{{ .password }}" }}"
        url: {{ $url | quote }}
        directUrl: {{ $url | quote }}
      {{- else }}
      mergePolicy: Merge
      {{- end }}
{{- end }}
{{- if and (eq $source "extract") (not .Values.postgres.enabled) }}
{{- $admin := include "data.roleSecret" (list . "admin") }}
---
# The managed database's admin login, only for the roles Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $admin }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  dataFrom:
    - extract:
        key: {{ printf "%sadmin" .Values.credentials.keyPrefix }}
  target:
    name: {{ $admin }}
    creationPolicy: Owner
{{- end }}
{{- if or .Values.valkey.enabled (eq $source "extract") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.valkey.secretName }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  {{- if eq $source "generate" }}
  refreshInterval: "0"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "data.name" . }}-password
  target:
    name: {{ .Values.valkey.secretName }}
    creationPolicy: Owner
    template:
      data:
        host: {{ include "data.valkeyHost" . }}
        port: "6379"
        password: "{{ "{{ .password }}" }}"
        url: {{ printf "redis://:{{ .password }}@%s:6379" (include "data.valkeyHost" .) | quote }}
  {{- else }}
  refreshInterval: 15m
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  dataFrom:
    - extract:
        key: {{ printf "%svalkey" .Values.credentials.keyPrefix }}
  target:
    name: {{ .Values.valkey.secretName }}
    creationPolicy: Owner
  {{- end }}
{{- end }}
{{- end }}
