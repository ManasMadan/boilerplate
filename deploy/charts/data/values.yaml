# Where the application's data lives. Environments override these in
# deploy/environments/<env>/data.yaml.

# Postgres roles: the migrator owns every schema; each service logs in as its own role
# and can only use what migrations grant it (see infra/postgres/init for the same setup
# locally). One Secret per role, `<secretPrefix><role>` (underscores become dashes),
# with keys username, password, url and directUrl.
database:
  name: app
  secretPrefix: db-
  roles: [migrator, app_api, app_worker, app_notifications, app_webhooks, app_ai]

# Where those Secrets come from:
#   generate  External Secrets makes a random password per role, once (in-cluster
#             Postgres with the External Secrets operator: previews, BYO clusters)
#   extract   External Secrets copies them from the secret manager, where OpenTofu
#             wrote them (managed Postgres)
#   provided  they already exist (kind: `bun run k8s:up` creates them)
credentials:
  source: generate
  storeRef:
    kind: ClusterSecretStore
    name: platform
  # extract: the remote secret for a role is `<keyPrefix><role>`, a JSON object with
  # the four keys above.
  keyPrefix: ""

# In-cluster Postgres with CloudNativePG. Off when the database is managed (RDS,
# Cloud SQL, Azure Flexible Server): then only the credentials above are rendered.
postgres:
  enabled: true
  instances: 2
  # PostgreSQL 18 with pgvector.
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  parameters:
    max_connections: "200"
  # Continuous backups (WAL archiving + base backups, point-in-time recovery) through
  # the Barman Cloud plugin to object storage.
  backups:
    enabled: false
    # An ObjectStore resource (barmancloud.cnpg.io) the platform set up for this cluster;
    # retention is configured there.
    objectStore: ""
    schedule: "0 0 3 * * *"

# In-cluster Valkey (a single node: queues, sessions, rate limits, caches). Off for a
# managed Valkey/Redis (ElastiCache, Memorystore, Azure Cache): then the `valkey`
# Secret must hold its connection details (host, port, password, url).
valkey:
  enabled: true
  image: docker.io/valkey/valkey:9.1.2-alpine
  secretName: valkey
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # BullMQ needs every key kept: never evict, and persist to disk.
  maxmemory: 400mb

# A pull-request preview: this release owns its namespace (so deleting the preview
# deletes everything in it) with quotas that keep one preview from starving others.
preview:
  enabled: false
  namespace: ""
  quota:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
    persistentvolumeclaims: "4"
