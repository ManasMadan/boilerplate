# Where the application's data lives. Environments override these in
# deploy/environments/<env>/data.yaml.

# Postgres roles: the migrator owns every schema; each service logs in as its own role
# and can only use what migrations grant it (see infra/postgres/init for the same setup
# locally). One Secret per role, `<secretPrefix><role>` (underscores become dashes),
# with keys username, password, url and directUrl.
database:
  name: app
  secretPrefix: db-
  roles: [migrator, app_api, app_worker, app_notifications, app_webhooks, app_ai]

# Every password and key of the data services (the database roles, Valkey, object
# storage) is generated in the cluster the first time the release is installed, by a
# Job that creates each Secret only if it doesn't exist yet. They never leave the
# cluster, so they never need to be in git; everything else secret is (SOPS, see
# deploy/README.md).
credentials:
  image: docker.io/curlimages/curl:8.22.0

# Postgres with CloudNativePG.
postgres:
  instances: 2
  # PostgreSQL 18 with pgvector.
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  storage:
    size: 20Gi
    # k3s's default: a directory on the node. Replicas on other nodes are what keeps
    # the data when one is lost, so run at least two instances on a multi-node cluster.
    storageClass: local-path
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  parameters:
    max_connections: "200"
  # Continuous backups with the Barman Cloud plugin: WAL archived as it's written and a
  # base backup every day, to the backups object store below. Any point in time since
  # the oldest backup kept can be restored (see restore).
  backups:
    enabled: false
    # Six fields, seconds first (CloudNativePG's cron format): 03:00 every day.
    schedule: "0 0 3 * * *"
    # How long base backups and the WAL between them are kept.
    retention: 30d
    # The folder in the bucket this cluster archives to. Empty: the cluster's name. A
    # cluster restored from a backup must archive somewhere new (CloudNativePG refuses to
    # write over another cluster's WAL), so set it when you restore.
    serverName: ""
  # Bootstrap the cluster from the backups instead of an empty database: set enabled,
  # serverName to the folder the backup is in (the old cluster's serverName) and a new
  # backups.serverName, and optionally a point in time. Only for a new cluster: an
  # existing one ignores its bootstrap. deploy/README.md has the whole procedure.
  restore:
    enabled: false
    serverName: ""
    # RFC 3339 (2026-09-30T08:15:00Z); empty restores to the end of the archived WAL.
    targetTime: ""

# Valkey (a single node: queues, sessions, rate limits, caches). Its connection details
# are in the `secretName` Secret (host, port, password, url).
valkey:
  image: docker.io/valkey/valkey:9.1.2-alpine
  secretName: valkey
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # BullMQ needs every key kept: never evict, and persist to disk.
  maxmemory: 400mb

# Object storage with RustFS (S3 API). Two separate servers: `uploads`, which the
# browser reaches at `host` through the gateway (presigned URLs), and `backups`, which
# only Postgres reaches. Separate servers with their own root keys, so the application's
# keys can't touch the backups.
storage:
  image: docker.io/rustfs/rustfs:1.0.0
  # Creates the buckets and sets their CORS rules after every install and upgrade.
  buckets:
    image: docker.io/amazon/aws-cli:2.37.5
  region: us-east-1
  uploads:
    enabled: true
    bucket: uploads
    # The public host browsers upload to and download from (the stack's STORAGE_ORIGIN
    # and presigned URLs), e.g. files.example.com: it must be one of the gateway's hosts.
    host: ""
    scheme: https
    # Origins allowed to PUT and GET with presigned URLs (the site's).
    corsOrigins: []
    # The Secret the stack reads: bucket, region, endpoint (in-cluster), publicEndpoint,
    # accessKeyId, secretAccessKey.
    secretName: storage
    storage:
      size: 20Gi
      storageClass: local-path
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
  # On with postgres.backups. Pin it to another node with nodeSelector where there is
  # one, so losing a node's disk doesn't take the database and its backups together.
  backups:
    bucket: backups
    nodeSelector: {}
    storage:
      size: 50Gi
      storageClass: local-path
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }

# The gateway the uploads host is routed through (as in the stack chart), and where its
# proxies run, allowed through RustFS's network policy.
gateway:
  parentRefs:
    - name: public
      namespace: gateway-system
  namespaceSelector:
    kubernetes.io/metadata.name: envoy-gateway-system

# Where CloudNativePG's operator runs (it reaches each instance's status port and
# Postgres) and where Prometheus scrapes Postgres's metrics from: the platform's
# (deploy/platform/addons/cloudnative-pg.yaml, the observability add-ons).
networkPolicy:
  operatorNamespace: cnpg-system
  metricsNamespace: observability

# A copy of the backups and the uploads outside the cluster, so losing the cluster (or
# the one disk of a one-node cluster) doesn't take the database, its backups and every
# upload together. Any S3-compatible storage you run somewhere else will do: a RustFS
# or MinIO on another machine, in another place. On once `endpoint` is set: a CronJob
# per bucket copies new objects there on `schedule` (rclone copy: nothing is deleted
# offsite, so a wiped bucket here can't wipe the copy; expire old objects with the
# bucket's lifecycle rules there). The keys are in the `secretName` Secret
# (accessKeyId, secretAccessKey), from environments/<env>/secrets/. `required` refuses
# to render without it (production).
offsite:
  required: false
  # e.g. https://s3.backups.example.net
  endpoint: ""
  region: us-east-1
  bucket: ""
  # A folder of the bucket for this environment: <bucket>/<prefix>/{backups,uploads}.
  prefix: ""
  secretName: offsite-storage
  schedule: "17 * * * *"
  image: docker.io/rclone/rclone:1.75.1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# A pull-request preview: this release owns its namespace (so deleting the preview
# deletes everything in it) with quotas that keep one preview from starving others.
preview:
  enabled: false
  namespace: ""
  quota:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
    persistentvolumeclaims: "4"
