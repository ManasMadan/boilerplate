# Staging: production's shape at a smaller size. CI sets image.tag on every merge to
# master (a commit to this file).
image:
  tag: ""
site:
  # Your staging host.
  host: staging.example.com
services:
  notifications:
    env:
      # Mail goes through the cluster's mail server (deploy/platform/mail): SMTP_URL,
      # with the submission password, is in secrets/notifications.sops.yaml.
      # Your sender: the mail server's submission account on its email domain.
      EMAIL_FROM: Boilerplate <no-reply@example.com>
  web:
    autoscaling: { minReplicas: 2, maxReplicas: 4 }
    env:
      # The mobile app build that talks to this site (the preview variant): its https
      # links open the app and its passkeys work there. The web app refuses to start
      # until all four are set (docs/web-and-mobile.md, "Universal links and App Links").
      APPLE_TEAM_ID: ""
      IOS_BUNDLE_ID: com.boilerplate.app.preview
      ANDROID_PACKAGE: com.boilerplate.app.preview
      ANDROID_CERT_FINGERPRINTS: ""
  api:
    autoscaling: { minReplicas: 2, maxReplicas: 4 }
  clamav:
    enabled: true
