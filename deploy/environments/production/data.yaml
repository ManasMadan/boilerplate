# Production: two Postgres instances, continuous backups kept 30 days.
postgres:
  instances: 2
  storage: { size: 50Gi }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  backups:
    enabled: true
    retention: 30d
storage:
  uploads:
    # Your production hosts: one of the gateway's (<domain> or *.<domain>).
    host: files.example.com
    corsOrigins: [https://app.example.com]
    storage: { size: 100Gi }
  backups:
    storage: { size: 200Gi }
# The copy outside the cluster: required in production. Your S3-compatible storage on
# another machine; its keys go in secrets/offsite-storage.sops.yaml.
offsite:
  required: true
  endpoint: https://s3.backups.example.net
  bucket: boilerplate-offsite
  prefix: production
