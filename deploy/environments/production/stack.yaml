# Production. Its image tag and the revision these values are read at are in
# release.yaml, which only a promotion pull request changes (merge = deploy).
site:
  # Your production host.
  host: app.example.com
env:
  LOG_LEVEL: info
defaults:
  replicas: 3
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }
  keda:
    minReplicas: 2
    maxReplicas: 20
services:
  notifications:
    env:
      # Mail goes through the cluster's mail server (deploy/platform/mail): SMTP_URL,
      # with the submission password, is in secrets/notifications.sops.yaml.
      # Your sender: the mail server's submission account on its email domain.
      EMAIL_FROM: Boilerplate <no-reply@example.com>
  web:
    autoscaling: { minReplicas: 3, maxReplicas: 20 }
    env:
      # The mobile app build that talks to this site (the production variant): its https
      # links open the app and its passkeys work there. The web app refuses to start
      # until all four are set (docs/web-and-mobile.md, "Universal links and App Links").
      APPLE_TEAM_ID: ""
      IOS_BUNDLE_ID: com.boilerplate.app
      ANDROID_PACKAGE: com.boilerplate.app
      ANDROID_CERT_FINGERPRINTS: &android-certs ""
  api:
    autoscaling: { minReplicas: 3, maxReplicas: 30 }
    env:
      # Passkeys made in the Android app come from its certificates, the web's above
      # (apps/api/src/auth/auth.ts).
      ANDROID_CERT_FINGERPRINTS: *android-certs
  clamav:
    enabled: true
    replicas: 2
