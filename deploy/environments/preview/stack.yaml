# A pull request's preview (deploy/argocd/appsets/previews.yaml sets image.tag to the
# PR's commit and site.host to pr-<number>.preview.<domain>). Small, one replica, and
# queue workers idle at zero.
secrets:
  externalSecrets:
    enabled: true
    # Shared, non-production credentials for every preview (test-mode Stripe, …).
    keyPrefix: boilerplate/preview/
defaults:
  replicas: 1
  topologySpread: false
  pdb:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  keda:
    minReplicas: 0
    maxReplicas: 2
services:
  web:
    autoscaling: { enabled: false }
  api:
    autoscaling: { enabled: false }
  worker:
    env:
      FILE_SCANNER: none
