# A pull request's preview (deploy/argocd/appsets/previews.yaml sets image.tag to the
# PR's commit and site.host to pr-<number>.preview.<domain>). Small, one replica, and
# queue workers idle at zero. Its Secrets are shared by every preview, non-production
# credentials (test-mode Stripe, …): deploy/environments/preview/secrets/.
defaults:
  replicas: 1
  topologySpread: false
  pdb:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  keda:
    minReplicas: 0
    maxReplicas: 2
services:
  web:
    autoscaling: { enabled: false }
    storage: none
    env:
      # The mobile app build that talks to this site (the preview variant): its https
      # links open the app and its passkeys work there. The web app refuses to start
      # until all four are set (docs/web-and-mobile.md, "Universal links and App Links").
      APPLE_TEAM_ID: ""
      IOS_BUNDLE_ID: com.boilerplate.app.preview
      ANDROID_PACKAGE: com.boilerplate.app.preview
      ANDROID_CERT_FINGERPRINTS: ""
  api:
    autoscaling: { enabled: false }
    # No file uploads (no ClamAV, no uploads bucket: see data.yaml).
    storage: none
  worker:
    storage: none
    env:
      FILE_SCANNER: none
  notifications:
    # Mail stays in the preview: its own Mailpit (the data chart's), over TLS with a
    # certificate from the namespace's own authority, which this trusts. Mailpit takes
    # any login, and nothing leaves.
    caBundle: mailpit-tls
    env:
      SMTP_URL: smtps://no-reply%40preview.invalid:preview@mailpit:1025
      EMAIL_FROM: Boilerplate Preview <no-reply@example.com>
