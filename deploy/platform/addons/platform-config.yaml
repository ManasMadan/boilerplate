# This cluster's Gateway, certificate issuer, secret store and image policy
# (deploy/platform/config), from the cluster's annotations.
addon: platform-config
namespace: gateway-system
path: deploy/platform/config
wave: "0"
clusterParameters:
  cloud: cloud
  environment: environment
  domain: domain
  tls.email: tls-email
  tls.dns01: dns01
  secretStore.provider: secret-store
  secretStore.aws.region: aws-region
  secretStore.gcp.projectID: gcp-project
  secretStore.azure.vaultUrl: azure-vault-url
  imagePolicy.enabled: image-policy
