# Secrets from the cloud's secret manager (ClusterSecretStore "platform").
addon: external-secrets
namespace: external-secrets
repoURL: https://charts.external-secrets.io
chart: external-secrets
version: 2.11.0
wave: "-20"
clusterParameters:
