# aws | gcp | azure | other
cloud: other
# staging | production
environment: staging
# The DNS zone the cluster serves: hosts are <domain> and *.<domain> (and
# *.preview.<domain> when the cluster hosts previews).
domain: ""
# Pull-request previews run here (normally on staging).
previews: false

gateway:
  # Annotations for the gateway's load balancer Service (per cloud, from OpenTofu).
  serviceAnnotations: {}
  # Proxies in front of the gateway that add to X-Forwarded-For: 1 behind Cloudflare,
  # 0 when clients connect directly.
  trustedHops: 1

# Let's Encrypt certificates, validated through DNS (works for wildcards and before the
# load balancer is reachable).
tls:
  email: ""
  # cloudflare | route53 | clouddns | azuredns
  dns01: cloudflare
  # Let's Encrypt's staging endpoint for trying things out (untrusted certificates).
  staging: false
  cloudflare:
    # Secret in cert-manager's namespace with key `token` (Zone:DNS:Edit on the zone).
    tokenSecret: cloudflare-api-token
  route53: { region: "", hostedZoneID: "" }
  clouddns: { project: "" }
  azuredns: { subscriptionID: "", resourceGroupName: "", hostedZoneName: "", clientID: "" }

# The ClusterSecretStore every ExternalSecret uses ("platform"), authenticated with the
# cloud's workload identity for External Secrets' service account.
secretStore:
  # aws | gcp | azure | vault
  provider: aws
  aws: { region: "" }
  gcp: { projectID: "" }
  azure: { vaultUrl: "" }
  vault: { server: "", path: secret, role: external-secrets }

# The environment's prefix in the secret manager (e.g. boilerplate-production-).
secretPrefix: ""

# Platform credentials copied from the secret manager (remote key <secretPrefix><name>),
# for the add-ons that need them: the Cloudflare API token (DNS records and DNS-01), and
# on the cluster hosting previews the GitHub token Argo CD lists pull requests with.
platformSecrets:
  cloudflareToken: cloudflare-api-token
  githubToken: github-token

# Only images built and signed by this repo's CI (keyless, GitHub OIDC) may run in the
# application namespaces. On for production.
imagePolicy:
  enabled: false
  images: ["ghcr.io/manasmadan/boilerplate/*"]
  namespaces: [boilerplate]
  # The workflow that signs releases, on the default branch.
  subject: "https://github.com/ManasMadan/boilerplate/.github/workflows/*@refs/heads/master"
