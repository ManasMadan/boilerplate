# The DNS zone the cluster serves: hosts are <domain> and *.<domain> (and
# *.preview.<domain> when the cluster hosts previews).
domain: ""
# Pull-request previews run here (normally on staging).
previews: false

gateway:
  # Annotations for the gateway's LoadBalancer Service. k3s's ServiceLB needs none: it
  # publishes the ports on every node.
  serviceAnnotations: {}
  # Proxies in front of the gateway that add to X-Forwarded-For: 1 behind Cloudflare,
  # 0 when clients connect directly.
  trustedHops: 1
  # Refuse the site's hosts to connections without Cloudflare's origin-pull client
  # certificate, so nothing reaches them except through Cloudflare. Off only for a
  # cluster with no Cloudflare in front (and then trustedHops: 0).
  originPulls: true

# Let's Encrypt certificates, validated through DNS on Cloudflare (works for wildcards
# and before the gateway is reachable).
tls:
  email: ""
  # Let's Encrypt's staging endpoint for trying things out (untrusted certificates).
  staging: false
  # Secret in cert-manager's namespace with key `token` (Zone:DNS:Edit on the zone),
  # from deploy/platform/secrets/<environment>/.
  cloudflareTokenSecret: cloudflare-api-token

# Only images built and signed by this repo's CI (keyless, GitHub OIDC) may run in the
# application namespaces. On for production.
imagePolicy:
  enabled: false
  images: ["ghcr.io/manasmadan/boilerplate/*"]
  namespaces: [boilerplate]
  # The workflow that signs releases, on the default branch.
  subject: "https://github.com/ManasMadan/boilerplate/.github/workflows/*@refs/heads/master"
  # A cosign public key (PEM) to check signatures against instead: no dependency on
  # Sigstore's public services, and any CI can sign. Its private key is deploy.yml's
  # COSIGN_PRIVATE_KEY secret (deploy/README.md, "Image signatures").
  publicKey: ""
