{{- if .Values.imagePolicy.enabled }}
{{- $p := .Values.imagePolicy }}
---
# Pods in the application namespaces run only images that this repo's release workflow
# signed (cosign keyless: the signature names the GitHub workflow and branch).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: signed-by-ci
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                {{- toYaml $p.namespaces | nindent 16 }}
      verifyImages:
        - imageReferences:
            {{- toYaml $p.images | nindent 12 }}
          failureAction: Enforce
          mutateDigest: true
          attestors:
            - entries:
                - keyless:
                    subject: {{ $p.subject | quote }}
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev
{{- end }}
