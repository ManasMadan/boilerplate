{{- $s := .Values.secretStore }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    {{- if eq $s.provider "aws" }}
    # Credentials from External Secrets' EKS Pod Identity.
    aws:
      service: SecretsManager
      region: {{ required "secretStore.aws.region is required" $s.aws.region }}
    {{- else if eq $s.provider "gcp" }}
    # Credentials from External Secrets' GKE workload identity.
    gcpsm:
      projectID: {{ required "secretStore.gcp.projectID is required" $s.gcp.projectID }}
    {{- else if eq $s.provider "azure" }}
    azurekv:
      vaultUrl: {{ required "secretStore.azure.vaultUrl is required" $s.azure.vaultUrl }}
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
    {{- else if eq $s.provider "vault" }}
    # Vault or OpenBao, for clusters without a cloud secret manager.
    vault:
      server: {{ required "secretStore.vault.server is required" $s.vault.server }}
      path: {{ $s.vault.path }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $s.vault.role }}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
    {{- else }}
    {{- fail (printf "secretStore.provider %q isn't supported (aws, gcp, azure, vault)" $s.provider) }}
    {{- end }}
