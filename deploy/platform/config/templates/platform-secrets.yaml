{{- /* Each is `{"token": "…"}` in the secret manager. */}}
{{- $prefix := required "secretPrefix is required" .Values.secretPrefix }}
{{- $targets := list }}
{{- if .Values.platformSecrets.cloudflareToken }}
{{- $targets = append $targets (dict "name" "cloudflare-api-token" "namespace" "cert-manager" "key" (printf "%s%s" $prefix .Values.platformSecrets.cloudflareToken)) }}
{{- $targets = append $targets (dict "name" "cloudflare-api-token" "namespace" "external-dns" "key" (printf "%s%s" $prefix .Values.platformSecrets.cloudflareToken)) }}
{{- end }}
{{- if and .Values.previews .Values.platformSecrets.githubToken }}
{{- $targets = append $targets (dict "name" "github-token" "namespace" "argocd" "key" (printf "%s%s" $prefix .Values.platformSecrets.githubToken)) }}
{{- end }}
{{- range $targets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ .name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .key }}
{{- end }}
