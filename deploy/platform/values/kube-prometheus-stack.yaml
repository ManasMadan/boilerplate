# k3s runs the control plane (etcd, scheduler, controller manager) and kube-proxy's job
# inside its own process, with nothing to scrape at the usual endpoints: scraping them
# would only raise "target down" alerts.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    # The services push their metrics over OTLP (the stack chart sets
    # OTEL_EXPORTER_OTLP_METRICS_ENDPOINT to /api/v1/otlp/v1/metrics here).
    enableOTLPReceiver: true
    # The alerts add-on's rules and pod monitors (deploy/platform/alerts), which aren't
    # labelled with this release.
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    otlp:
      promoteResourceAttributes: [service.name, service.instance.id]
    retention: 15d
    retentionSize: 18GB
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

grafana:
  # From deploy/platform/secrets/<environment>/grafana.sops.yaml (keys admin-user and
  # admin-password). Not public: kubectl -n observability port-forward
  # svc/kube-prometheus-stack-grafana 3000:80.
  admin:
    existingSecret: grafana-admin
  # Traces next to the metrics.
  additionalDataSources:
    - name: Jaeger
      type: jaeger
      uid: jaeger
      url: http://jaeger.observability.svc.cluster.local:16686
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

alertmanager:
  alertmanagerSpec:
    # The alerts add-on's receiver (an AlertmanagerConfig) takes every alert, not only
    # those from its own namespace.
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
