# An invitation link opened by the OS (boilerplate://invitations/<id>) joins the
# workspace. INVITATION_ID comes from an invitation sent to the signed-in user's address.
appId: com.boilerplate.app.development
---
- runFlow: sign-up-and-restart.yaml
- openLink: boilerplate://invitations/${INVITATION_ID}
- assertVisible: "What needs doing?"
