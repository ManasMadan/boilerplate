[project]
name = "ai"
version = "0.1.0"
description = "Python inference service. Its Pydantic models are the source of truth for the TypeScript client in packages/ai-client."
requires-python = ">=3.14"
dependencies = [
  "bullmq>=3.2.8",
  "fastapi[standard]>=0.141.1",
  "httpx>=0.28.1",
  "langgraph>=1.2.12",
  "mcp>=2.2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0",
  "opentelemetry-instrumentation-fastapi>=0.66b0",
  "opentelemetry-instrumentation-httpx>=0.66b0",
  "opentelemetry-instrumentation-psycopg>=0.66b0",
  "opentelemetry-instrumentation-redis>=0.66b0",
  "opentelemetry-sdk>=1.45.0",
  "pgvector>=0.5.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.13.5",
  "pydantic-ai-slim[anthropic,openai]>=2.51.0",
  "pydantic-settings>=2.15.0",
  "pyjwt[crypto]>=2.10.1",
  "sqlalchemy[asyncio]>=2.1.1",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = [
  "alembic>=1.17.0",
  "basedpyright>=1.40.1",
  "datamodel-code-generator>=0.83.0",
  "pydantic-evals>=2.51.0",
  "pytest-asyncio>=1.2.0",
  "httpx2>=2.13.1",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  "pytest-cov>=7",
  "watchfiles>=1.3.0",
  "python-dotenv>=1.2.3",
]

[tool.uv]
# This is an application, not a library; don't try to build/install it as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, ruff-specific.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
# Strict mode: every function signature and model field must be typed. This is what
# keeps the generated OpenAPI schema (and therefore the TypeScript types) precise.
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["app", "tests", "evals"]
reportUnusedCallResult = false
# A job or code added on the TypeScript side regenerates a Literal; every `match` over it
# must then handle the new value.
reportMatchNotExhaustive = true
reportAny = false
reportExplicitAny = false
# Tests drive untyped third-party clients (redis-py, TestClient internals) directly;
# the application code keeps every strict rule.
executionEnvironments = [
  { root = "tests", extraPaths = ["."], reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportAttributeAccessIssue = false, reportIndexIssue = false, reportArgumentType = false, reportPrivateUsage = false },
  { root = "app", extraPaths = ["."] },
  { root = "evals", extraPaths = ["."] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# `integration` tests need Postgres and Redis (bun run test:integration); the default
# run (bun run test) is pure.
markers = ["integration: needs Postgres and Redis"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]
# The worker runs as a subprocess in the integration tests; measure it there too.
patch = ["subprocess"]
omit = [
  # Generated from the JSON Schemas (bun run gen).
  "app/contracts/*",
  # Writes openapi.json for codegen.
  "app/export_openapi.py",
]

[tool.coverage.report]
# The floor the suite currently meets (unit + integration), rounded down, less a point
# for paths that only run sometimes. Raise it as tests are added.
fail_under = 95
show_missing = true
