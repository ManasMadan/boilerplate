# Squawk lints new database migrations for changes that are unsafe while the previous
# release is still running against the same database (locks, rewrites, broken reads):
# `bun run db:lint` (CI runs it on the migrations a pull request adds or changes).
#
# A flagged statement that is safe in context (an index on a table created in the same
# migration, say) gets `-- squawk-ignore <rule>` above it, with the reason.
pg_version = "18"
excluded_rules = [
  # Prisma applies each migration once and records it; re-runnable IF NOT EXISTS
  # statements add nothing.
  "prefer-robust-stmts",
  # Primary keys are UUIDs; integer columns are counters and versions, not ids.
  "prefer-bigint-over-int",
  "prefer-bigint-over-smallint",
  # Backfills may legitimately run long; lock_timeout (still required) is what keeps a
  # migration from blocking live traffic.
  "require-statement-timeout",
]
