# Local infrastructure for development and tests.
#
# Profiles keep the default fast: with no profile you get the core that every flow
# needs (Postgres, Valkey, Mailpit). `bun dev:full` / `bun run db:up --full` add the rest.
#
#   core     Postgres  localhost:55432  pgvector; `app` and `app_test` databases
#            Valkey    localhost:56379  Redis-compatible: sessions, cache, rate limits, queues
#            Mailpit   localhost:58025  catches every email sent in dev (SMTP :51025)
#   files    RustFS    localhost:59000  S3-compatible object storage (console :59001)
#            ClamAV    localhost:53310  virus scanning for uploads (clamd; first start
#                                       downloads signatures, a few minutes)
#
# Sharing a machine with other projects: host ports are in the 5xxxx range, so the usual
# 5432/6379 stay free for them, and every container has a memory limit, so one that
# grows is stopped on its own instead of starving everything else in Docker. Start them
# with `bun run db:up` (it checks the limits fit next to what's already running) and
# remove everything with `bun run docker:clean`.
#
# Images are pinned; Renovate proposes upgrades. Ports can be overridden in .env.
name: boilerplate

services:
  postgres:
    # The official Postgres image plus pgvector, on the same Debian (trixie) base as the
    # CloudNativePG image used in Kubernetes, so extensions and collation match.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    mem_limit: 512m
    volumes:
      - postgres:/var/lib/postgresql
      # Creates the separate `app_test` database used by integration tests.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine
    # Queued jobs live here: never evict keys (noeviction) and persist with AOF.
    # A memory ceiling below the container's limit: when full, writes fail with an error
    # instead of the container being killed.
    command:
      ["valkey-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: ["${VALKEY_PORT:-56379}:6379"]
    mem_limit: 256m
    volumes: [valkey:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # RustFS: Apache-2.0, S3-compatible object storage (MinIO stopped publishing images).
  rustfs:
    image: rustfs/rustfs:1.0.0
    profiles: [files, full]
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["${S3_PORT:-59000}:9000", "${S3_CONSOLE_PORT:-59001}:9001"]
    mem_limit: 384m
    volumes: [rustfs:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the uploads bucket once storage is up, so `bun dev` needs no manual step.
  s3-init:
    image: amazon/aws-cli:2.37.5
    profiles: [files, full]
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: rustfs
      AWS_SECRET_ACCESS_KEY: rustfs-secret
      AWS_DEFAULT_REGION: us-east-1
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-c"]
    # Browsers upload straight to the bucket with presigned PUTs, so it needs CORS for
    # the web origin; production buckets get the same rule from OpenTofu.
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000"
        $$S3 s3api head-bucket --bucket uploads 2>/dev/null || $$S3 s3 mb s3://uploads
        $$S3 s3api put-bucket-cors --bucket uploads --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["PUT","GET"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
    restart: "no"

  # clamd scans every upload before it's accepted. The Debian image has arm64 builds.
  clamav:
    image: clamav/clamav-debian:1.5
    profiles: [files, full]
    ports: ["${CLAMAV_PORT:-53310}:3310"]
    # Signatures take about 1 GB in memory. Loading the new set before dropping the old
    # one (the default) doubles that during every update; one copy at a time instead,
    # at the cost of a pause in scanning while it reloads.
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    mem_limit: 1536m
    volumes: [clamav:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 6m

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["${MAILPIT_SMTP_PORT:-51025}:1025", "${MAILPIT_UI_PORT:-58025}:8025"]
    mem_limit: 128m
    # Keeps more than the default 500: a full e2e run sends hundreds of emails.
    environment: { MP_MAX_MESSAGES: "5000" }
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30


  # Traces and metrics, locally: Jaeger v2 (built on the OpenTelemetry Collector) receives
  # OTLP and shows traces at http://localhost:56686. Point the services at it with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:54318 (see .env.example).
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [telemetry, full]
    ports: ["${JAEGER_OTLP_PORT:-54318}:4318", "${JAEGER_UI_PORT:-56686}:16686"]
    mem_limit: 256m


volumes:
  postgres:
  valkey:
  rustfs:
  clamav:
